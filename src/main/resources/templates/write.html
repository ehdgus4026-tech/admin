<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { zoom: 150%; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">
<header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white text-sm shadow-sm">
            <i class="fa-solid fa-pen"></i>
        </div>
        <h1 class="font-bold text-slate-900 text-base">게시글 작성</h1>
    </div>
    <div class="flex items-center gap-3">
        <a href="/posts" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition">
            <i class="fa-solid fa-arrow-left mr-1"></i> 목록으로
        </a>
    </div>
</header>

<main class="max-w-2xl mx-auto px-4 py-10 flex-1 w-full">
    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
        <!-- 💡 글쓰기 전송 폼 (작성자 입력란 삭제 완료) -->
        <form action="/posts/write" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">제목</label>
                <input type="text" name="title" required placeholder="제목을 입력하세요" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">내용</label>
                <textarea name="content" rows="6" required placeholder="내용을 입력하세요" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500"></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <a href="/posts" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-xl transition">취소</a>
                <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-sm transition">등록하기</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
