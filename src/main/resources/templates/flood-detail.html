<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홍수 대피소 상세 정보</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { zoom: 175%; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">
<header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white text-sm shadow-sm">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="font-bold text-slate-900 text-base">서울재난안전가이드</h1>
    </div>
    <a href="/flood" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition">
        <i class="fa-solid fa-arrow-left mr-1"></i> 목록으로
    </a>
</header>
<main class="max-w-xl mx-auto px-4 py-12 flex-1 w-full space-y-6">
    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm space-y-6" th:if="${shelter != null}">
        <div class="space-y-2 border-b border-slate-100 pb-4">
            <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">홍수 대피소 상세 정보</span>
            <h2 class="text-lg font-bold text-slate-900" th:text="${shelter.fcltNm}">대피소 이름</h2>
        </div>
        <div class="space-y-4 text-sm">
            <div class="flex items-start gap-3" th:if="${shelter.daddr != null}">
                <i class="fa-solid fa-location-dot text-rose-500 mt-1"></i>
                <div>
                    <p class="text-xs text-slate-400 font-bold">상세 주소</p>
                    <p class="text-slate-700 text-xs" th:text="${shelter.daddr}">주소</p>
                </div>
            </div>
            <div class="flex items-start gap-3">
                <i class="fa-solid fa-building-user text-emerald-500 mt-1"></i>
                <div>
                    <p class="text-xs text-slate-400 font-bold">관리 부서</p>
                    <p class="text-slate-700 text-xs" th:text="${shelter.mngDeptNm != null && shelter.mngDeptNm != '' ? shelter.mngDeptNm : '-'}">관리부서</p>
                </div>
            </div>
        </div>
        <div class="pt-4">
            <a href="/flood" class="block w-full text-center py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-sm transition">
                목록으로 돌아가기
            </a>
        </div>
    </div>
</main>
</body>
</html>
